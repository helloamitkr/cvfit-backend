  # ── Payment ───────────────────────────────────────────────────────────────

  /api/payment/create-order:
    post:
      tags: [Payment]
      summary: Create a Razorpay order for a PDF download (₹21)
      description: |
        Creates a Razorpay order and records it as `pending` in the orders table.
        Pass the returned `order_id` to the Razorpay checkout SDK, then verify via `/api/payment/verify`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resume_id]
              properties:
                resume_id:
                  type: string
                  example: "res_01HXYZ"
      responses:
        '200':
          description: Razorpay order details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PaymentOrder' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Razorpay API error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/payment/verify:
    post:
      tags: [Payment]
      summary: Verify Razorpay payment signature and mark order as successful
      description: |
        Validates HMAC-SHA256 signature (`order_id|payment_id` signed with Razorpay key secret).
        On success the order status becomes `success`. The PDF endpoint will then serve a
        watermark-free PDF for the next 30 minutes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resume_id, order_id, payment_id, signature]
              properties:
                resume_id:  { type: string, example: "res_01HXYZ" }
                order_id:   { type: string, example: "order_Pxxxxxxxxxxxxxxxx" }
                payment_id: { type: string, example: "pay_Pxxxxxxxxxxxxxxxx" }
                signature:  { type: string, example: "a3f9..." }
      responses:
        '200':
          description: Payment verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          activated: { type: boolean, example: true }
        '400':
          description: Invalid signature or missing fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/payment/cancel:
    post:
      tags: [Payment]
      summary: Mark an order as failed (Razorpay modal dismissed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: { type: string, example: "order_Pxxxxxxxxxxxxxxxx" }
      responses:
        '200':
          description: Order marked as failed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok: { type: boolean, example: true }

  /api/payment/status:
    get:
      tags: [Payment]
      summary: Check if current user has a recent payment (last 30 min)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          has_paid: { type: boolean, example: false }

  # ── Resume Creation Requests ───────────────────────────────────────────────

  /api/requests:
    post:
      tags: [Requests]
      summary: Submit an "Ask Us to Create" resume request (₹500)
      description: |
        Creates a pending request and a Razorpay order for ₹500.
        Verify payment via `/api/requests/verify`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:        { type: string, example: "Jane Doe" }
                email:       { type: string, example: "jane@example.com" }
                resume_link: { type: string, example: "https://drive.google.com/file/d/..." }
                wants_call:  { type: boolean, example: false }
                notes:       { type: string, example: "5 years in fintech, targeting product roles" }
      responses:
        '201':
          description: Request created with payment order details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          request_id: { type: string }
                          order_id:   { type: string }
                          amount:     { type: integer, example: 50000 }
                          currency:   { type: string, example: "INR" }
                          key_id:     { type: string }
        '400':
          description: name and email are required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/requests/verify:
    post:
      tags: [Requests]
      summary: Verify payment for a resume creation request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, payment_id, signature, request_id]
              properties:
                order_id:   { type: string }
                payment_id: { type: string }
                signature:  { type: string }
                request_id: { type: string }
      responses:
        '200':
          description: Payment verified, request status set to paid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          paid: { type: boolean, example: true }
        '400':
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

