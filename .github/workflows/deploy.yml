name: Deploy

on:
  push:
    branches: [master]

env:
  AWS_REGION: ap-south-1
  LAMBDA_FUNCTION: cvfit-api-prod
  GO_VERSION: "1.22"

jobs:
  deploy:
    name: Build & Deploy Lambda
    runs-on: ubuntu-latest

    steps:
      # Check out backend at the repo root
      - uses: actions/checkout@v4
        with:
          path: cvfit-backend

      # Check out cvfit-tools as a sibling directory so the go.mod
      # replace directive (=> ../cvfit-tools) resolves correctly in CI.
      - uses: actions/checkout@v4
        with:
          repository: helloamitkr/cvfit-tools
          path: cvfit-tools

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cvfit-backend/go.sum

      - name: Build Lambda binary
        working-directory: cvfit-backend
        run: make lambda-build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda
        working-directory: cvfit-backend
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --zip-file fileb://bin/lambda.zip \
            --architectures arm64

          echo "Waiting for update to complete..."
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION }}

          echo "Done. Invoking health check..."
          aws lambda invoke \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --payload '{"rawPath":"/health","requestContext":{"http":{"method":"GET"}}}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/response.json && cat /tmp/response.json
